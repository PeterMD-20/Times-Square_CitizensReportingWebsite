<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Citizen Reporting Website</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="stylesheet" href="styles/login.css">
        <link rel="stylesheet" href="styles/home.css">
        <link rel="stylesheet" href="styles/navbar.css">
        <link rel="stylesheet" href="styles/footer.css">
    </head>

    <body class="d-flex flex-column min-vh-100">
        <header class="navbar navbar-expand-md sticky-top bg-light px-3 px-lg-5">
            <div class="container-fluid">
                <a class="btn" id="logo" href="index.html">CRW</a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#site-navigation" aria-label="Open navigation menu" aria-expanded="false" aria-controls="site-navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>

                <nav class="collapse navbar-collapse justify-content-md-end" id="site-navigation" aria-label="Main navigation">
                    <div class="navbar-nav align-items-md-center gap-md-5">
                        <a class="btn" href="index.html" aria-current="page">Home</a>
                        <a class="btn" href="about.html">About</a>
                        <a class="btn" href="track.html">Track Report Status</a>
                        <a class="btn btn-outline-dark ms-md-2" href="Report.html">Report</a>
                    </div>
                </nav>
            </div>
        </header>

        <main class="flex-grow-1">
            
            <h1 class="website-Title">Citizen Reporting Website</h1>

            <section id="section">
                <article class="login-registration-box" id="loginSection"><!--Login-->
                <h1 class="login-registration-title">Login</h1>

                <label class="prompt">Email:</label> <input type="email" name="email">
                <br/>

                <label class="prompt">Password:</label> <input type="password" name="password">
                </article>

                <article class="login-registration-box" id="registrationSection"><!--Registration-->
                    <h1 class="login-registration-title">Registration</h1>

                    <label class="prompt">Email:</label>
                    <input type="email" name="email">
                    <br/>

                    <label class="prompt">Contact Number <i>(Optional)</i>: </label>
                    <input type="tel" name="contactNumber">
                    <br/>

                    <label class="prompt">Password: </label>
                    <input type="password" name="password">
                    <br/>

                    <label class="prompt">Confirm Password: </label>
                    <input type="password">
                </article>
            </section>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <footer class="site-footer py-4">
            <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2">
                <p class="footer-copyright mb-0">&copy; 2026 Citizen Reporting Website</p>
                <p class="footer-notice mb-0">This is intended for Web Development (WEBDEVT) demo purposes only.</p>
            </div>
        </footer>
    </body>
</html>
